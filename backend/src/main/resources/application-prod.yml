spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
server:
  shutdown: graceful
  error:
    include-message: never
logging:
  structured:
    format:
      console: ecs
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
app:
  frontend-origin: ${FRONTEND_ORIGIN}
